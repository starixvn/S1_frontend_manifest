apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-deployment
  namespace: leobet
  labels:
    app: mobile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobile
  template:
    metadata:
      labels:
        app: mobile
    spec:
      containers:
        - name: mobile
          image: harbor.ailabpte.co/mobile/next-yashbet-dev:1e39260
          ports:
            - containerPort: 5074
      imagePullSecrets:
        - name: ailab
