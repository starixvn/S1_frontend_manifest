apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adminweb-ingress
  namespace: leobet
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: leobet-backoffice-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
spec:
  ingressClassName: alb
  rules:
    - host: "backoffice.aiking88dev.net"
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: adminweb-service
              port:
                number: 80