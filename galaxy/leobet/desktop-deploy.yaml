apiVersion: apps/v1
kind: Deployment
metadata:
  name: desktop-deployment
  namespace: leobet
  labels:
    app: desktop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: desktop
  template:
    metadata:
      labels:
        app: desktop
    spec:
      containers:
        - name: desktop
          image: harbor.ailabpte.co/desktop/next-leobet-dev:1264c38
          ports:
            - containerPort: 5073
      imagePullSecrets:
        - name: ailab
