apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: desktop-ingress
  namespace: leobet
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: leobet-desktop-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
      http:
        paths:
        - path: /en/entPage
          pathType: Prefix
          backend:
            service:
              name: membersite-service
              port:
                number: 80
        - path: /hi/entPage
          pathType: Prefix
          backend:
            service:
              name: membersite-service
              port:
                number: 80
        - path: /en/Cashier
          pathType: Prefix
          backend:
            service:
              name: membersite-service
              port:
                number: 80
        - path: /hi/Cashier
          pathType: Prefix
          backend:
            service:
              name: membersite-service
              port:
                number: 80
        - path: /
          pathType: Prefix
          backend:
            service:
              name: desktop-service
              port:
                number: 80