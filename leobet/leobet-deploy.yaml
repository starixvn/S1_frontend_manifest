apiVersion: apps/v1
kind: Deployment
metadata:
  name: leobet-deployment
  namespace: leobet
  labels:
    app: leobet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leobet
  template:
    metadata:
      labels:
        app: leobet
    spec:
      containers:
        - name: leobet
          image: harbor.ailabpte.co/desktop/next-sample-dev:3c7ce2b
          ports:
            - containerPort: 5073
      imagePullSecrets:
        - name: ailab
