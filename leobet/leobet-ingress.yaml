apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leobet-ingress
  namespace: leobet
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: leobet-alb
    alb.ingress.kubernetes.io/group.name: leobet-group
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: leobet-service
              port:
                number: 80