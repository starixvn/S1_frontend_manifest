apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova88-deployment
  namespace: nova88
  labels:
    app: nova88
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nova88
  template:
    metadata:
      labels:
        app: nova88
    spec:
      containers:
      - name: nova88
        image: harbor.ailabpte.co/desktop/next-sample-hulk:1e7c19d
        ports:
        - containerPort: 5073
      imagePullSecrets:
      - name: ailab